<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>04 · Offset Cards — Slava Style</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;1,400&family=Inter:wght@400;500&family=Noto+Serif+SC:wght@400;500;600&family=Noto+Sans+SC:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/base.css">
<style>
  .cards-row { display:grid; grid-template-columns:repeat(12,1fr); gap:24px; margin-top:80px; padding-bottom:60px; }
  .cards-row .sv-card:nth-child(1) { grid-column:1/5; }
  .cards-row .sv-card:nth-child(2) { grid-column:5/9; transform:translateY(48px); }
  .cards-row .sv-card:nth-child(3) { grid-column:9/13; }
  .sv-card h4 { font-family:var(--font-display); font-size:26px; font-weight:500; margin-bottom:8px; }
  .sv-card p { font-size:14px; color:rgba(26,26,26,.6); }
</style>
</head>
<body>
<section class="sv-section">
  <div class="sv-container">
    <div class="sv-kicker">04 — 三种角色</div>
    <h2 class="sv-h2" style="margin-top:28px;max-width:20ch;">同一套事实，<br>三种<em style="font-style:italic;color:var(--accent)">读法</em></h2>
    <div class="cards-row">
      <div class="sv-card sv-card--sage"><h4>投资经理</h4><p>组合视图、归因拆解与再平衡建议，一屏之内。</p></div>
      <div class="sv-card sv-card--dusty"><h4>风控合规</h4><p>敞口监控与披露文档，全程留痕可审计。</p></div>
      <div class="sv-card sv-card--terra"><h4>客户顾问</h4><p>把复杂结论翻译成客户听得懂的一段话。</p></div>
    </div>
  </div>
</section>
</body>
</html>
