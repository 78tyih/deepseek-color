<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Skin P1 · 深潜蓝 × Hero — DeepSeek Color</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;1,400&family=Inter:wght@400;500&family=Noto+Serif+SC:wght@400;500;600&family=Noto+Sans+SC:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F5F7FB; --ink: #0E1B3D; --ink-soft: #5A6B8C;
    --accent: #4D6BFE; --hairline: rgba(14,27,61,.14);
    --font-display: "Playfair Display", "Noto Serif SC", serif;
    --font-body: "Inter", "Noto Sans SC", system-ui, sans-serif;
  }
  body { background:var(--paper); color:var(--ink); font-family:var(--font-body); margin:0; -webkit-font-smoothing:antialiased; }
  .nav { display:flex; justify-content:space-between; align-items:center; padding:28px 40px; }
  .nav-logo { font-family:var(--font-display); font-size:22px; font-weight:600; }
  .nav-links { display:flex; gap:36px; font-size:14px; }
  .nav-links a { color:var(--ink-soft); text-decoration:none; }
  .sv-display { font-family:var(--font-display); font-size:clamp(3rem,6.4vw,5.6rem); line-height:1.04; letter-spacing:-0.03em; font-weight:500; }
  .sv-display em { font-style:italic; color:var(--accent); }
  .sv-kicker { display:flex; align-items:center; gap:14px; font-size:12px; font-weight:500; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-soft); }
  .sv-kicker::before { content:""; width:32px; height:1px; background:var(--hairline); }
  .sv-micro { font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-soft); }
  .btn { display:inline-flex; padding:13px 26px; border-radius:999px; border:1px solid var(--hairline); font-size:14px; font-weight:500; text-decoration:none; color:var(--ink); }
  .btn--accent { background:var(--accent); border-color:var(--accent); color:#fff; }
  .outline { font-family:var(--font-display); font-size:clamp(6rem,15vw,13rem); color:transparent; -webkit-text-stroke:1px var(--hairline); position:absolute; top:-10px; left:-8px; z-index:0; user-select:none; }
  .grid { display:grid; grid-template-columns:repeat(12,1fr); gap:24px; max-width:1360px; margin:0 auto; padding:80px 40px 60px; position:relative; }
  .headline { grid-column:1/9; position:relative; z-index:3; }
  .media { grid-column:8/13; grid-row:1; aspect-ratio:4/5; align-self:end; margin-top:16%; background:#A9BCE0; border-radius:22px; display:flex; align-items:flex-end; padding:30px; z-index:2; }
  .foot { grid-column:1/13; display:flex; justify-content:space-between; margin-top:64px; padding-top:26px; border-top:1px solid var(--hairline); }
</style>
</head>
<body>
<nav class="nav">
  <div class="nav-logo">Aurora<span style="color:var(--accent)">.</span></div>
  <div class="nav-links"><a href="#">产品</a><a href="#">数据</a><a href="#">能力</a><a href="#">联系</a></div>
  <a class="btn" href="#">预约演示</a>
</nav>
<div class="grid">
  <span class="outline">Aurora</span>
  <div class="headline">
    <div class="sv-kicker">Skin P1 — 深潜蓝</div>
    <h1 class="sv-display" style="margin-top:30px;">让每一笔资产<br>都被 <em>智能</em> 看见</h1>
    <p style="max-width:44ch; color:var(--ink-soft); margin-top:26px;">同一套首屏骨架，仅替换 6 个 CSS 变量即完成换肤——这是 深潜蓝 色卡下的样子。</p>
    <div style="display:flex; gap:16px; margin-top:34px;">
      <a class="btn btn--accent" href="#">开始使用</a>
      <a class="btn" href="#">了解产品 →</a>
    </div>
  </div>
  <div class="media"><span class="sv-micro" style="color:rgba(0,0,0,.5);">Portfolio · Real-time</span></div>
  <div class="foot">
    <span class="sv-micro">服务 120+ 机构客户</span><span class="sv-micro">AUM 超 ¥80 亿</span><span class="sv-micro">深潜蓝 · Palette P1</span>
  </div>
</div>
</body>
</html>
