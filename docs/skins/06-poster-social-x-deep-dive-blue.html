<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>06 · Social Poster — DeepSeek Color</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;1,400&family=Inter:wght@400;500&family=Noto+Serif+SC:wght@400;500;600&family=Noto+Sans+SC:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/base.css">
<style>
  body { background: var(--paper-2); display:flex; justify-content:center; padding:40px; }
  .poster {
    width: 900px; aspect-ratio: 4/5; background: var(--paper);
    border-radius: 32px; padding: 72px; position: relative; overflow: hidden;
    display: flex; flex-direction: column;
  }
  .poster h1 { font-size: 88px; margin: 40px 0 0; }
  .poster .img-block {
    position: absolute; right: -60px; bottom: 160px; width: 420px; height: 520px;
    background: var(--blush); border-radius: 28px; transform: rotate(-3deg);
    display:flex; align-items:flex-end; padding:28px;
  }
  .poster .img-block .sv-micro { color: rgba(26,26,26,.55); }
  .poster .body { max-width: 34ch; color: var(--ink-soft); margin-top: 36px; font-size: 18px; }
  .poster .foot {
    margin-top: auto; display:flex; justify-content:space-between; align-items:center;
    padding-top: 24px; border-top: 1px solid var(--hairline); position:relative; z-index:2;
  }
</style>
<style>
/* skin override: 深潜蓝 */
:root {
  --paper:#F5F7FB; --paper-2:#EAEEF7;
  --ink:#0E1B3D; --ink-soft:#5A6B8C;
  --accent:#4D6BFE; --hairline:rgba(14,27,61,.14);
  --night:#121212; --night-2:#1C1C1A; --paper-on-night:#EDEAE4; --hairline-dark:rgba(237,234,228,.16);
  --sage:#A9BCE0; --dusty-blue:#DCE5F5; --terracotta:#A9BCE0;
  --blush:#DCE5F5; --taupe:#A9BCE0; --moss:#DCE5F5;
}
.sv-card--neutral { background:rgba(26,26,26,.04); }

</style>
</head>
<body>
<div class="poster">
  <div class="sv-kicker">DeepSeek Color · 设计模板库</div>
  <h1 class="sv-display">安静的<br><em>高级感</em></h1>
  <p class="body">黑白灰基底 × 低饱和灰调 × 一点强调色。杂志感排版，图文穿插，留白即设计。</p>
  <div class="img-block"><span class="sv-micro">DeepSeek Color · 04</span></div>
  <div class="foot">
    <span class="sv-micro">DeepSeek Color · 色系研究</span>
    <span class="sv-tag">Template 06</span>
  </div>
</div>
</body>
</html>
